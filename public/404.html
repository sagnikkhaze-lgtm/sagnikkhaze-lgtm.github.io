<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback: redirect all 404s to index.html
      // preserving the path and query string via sessionStorage.
      sessionStorage.setItem("spa-redirect", location.pathname + location.search + location.hash);
      location.replace("/");
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
